name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "icons/**"
      - "assets/icon.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site with icons
        run: |
          mkdir -p _site
          cp -R site/. _site/
          mkdir -p _site/icons
          cp icons/*.png _site/icons/
          cp assets/icon.svg _site/icon.svg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
