<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redact-It</title>
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <div id="toolbar">
      <label class="strength-label">
        Strength:
        <input type="range" id="strength-slider" min="1" max="4" value="3" step="1" />
        <span id="strength-value">3</span>
      </label>
      <span id="rect-count">0 rects</span>
      <span style="flex: 1"></span>
      <button id="btn-download">Download</button>
      <button id="btn-copy" class="primary">Copy Redacted</button>
    </div>

    <div id="canvas-container">
      <canvas id="base"></canvas>
      <canvas id="overlay"></canvas>
    </div>

    <div id="toast" aria-live="polite"></div>

    <script type="module" src="./editor.ts"></script>
  </body>
</html>
